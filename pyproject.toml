[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-window-forecast"
version = "0.2.0"
description = "Inferencia bayesiana conjunta de janela, modelo e forecast para series mensais."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
docs = [
  "matplotlib>=3.8",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "reportlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
